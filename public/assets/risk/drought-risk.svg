<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="riskGlow" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#991b1b" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#450a0a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#180202" stop-opacity="1"/>
    </radialGradient>
    <pattern id="crackedSoil" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 0,20 L 30,35 L 50,15 L 75,40 L 100,25 M 30,35 L 45,70 L 20,100 M 45,70 L 80,85 L 100,100" fill="none" stroke="#f87171" stroke-width="0.8" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#riskGlow)"/>
  <rect width="1920" height="1080" fill="url(#crackedSoil)"/>

  <!-- Drought Severity Contour Iso-Bands -->
  <g fill="none" stroke-width="2" opacity="0.35">
    <path d="M-50,280 C400,180 820,340 1300,240 C1650,160 1850,300 2000,260" stroke="#f87171"/>
    <path d="M-50,460 C440,380 880,520 1340,400 C1700,310 1880,480 2000,440" stroke="#ef4444"/>
    <path d="M-50,680 C380,620 840,760 1280,640 C1640,550 1840,710 2000,670" stroke="#b91c1c"/>
  </g>

  <!-- Risk Hotspot Warning Zones -->
  <g fill="#ef4444" opacity="0.2">
    <circle cx="580" cy="380" r="110"/>
    <circle cx="580" cy="380" r="70" fill-opacity="0.3"/>
    <circle cx="580" cy="380" r="30" fill-opacity="0.5"/>

    <circle cx="1320" cy="560" r="140"/>
    <circle cx="1320" cy="560" r="85" fill-opacity="0.3"/>
    <circle cx="1320" cy="560" r="40" fill-opacity="0.5"/>
  </g>

  <!-- Hazard Crosshairs & Warning Glyphs -->
  <g stroke="#fca5a5" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <circle cx="580" cy="380" r="16"/>
    <line x1="580" y1="355" x2="580" y2="405"/>
    <line x1="555" y1="380" x2="605" y2="380"/>

    <circle cx="1320" cy="560" r="16"/>
    <line x1="1320" y1="535" x2="1320" y2="585"/>
    <line x1="1295" y1="560" x2="1345" y2="560"/>
  </g>
</svg>
