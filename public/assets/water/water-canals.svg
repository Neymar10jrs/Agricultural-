<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="waterGlow" cx="60%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#075985" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#032541" stop-opacity="1"/>
    </radialGradient>
    <pattern id="rippleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 Q 10 10, 20 20 T 40 20" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#waterGlow)"/>
  <rect width="1920" height="1080" fill="url(#rippleGrid)"/>

  <!-- Canal & Water Shed River System -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Canal Arteries -->
    <path d="M-50,540 C450,420 800,680 1300,500 C1650,380 1850,520 2000,480" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.35"/>
    <path d="M-50,540 C450,420 800,680 1300,500 C1650,380 1850,520 2000,480" stroke="#7dd3fc" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Distributary Branches -->
    <path d="M600,480 C750,300 950,220 1150,140" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.3"/>
    <path d="M980,620 C1080,750 1200,860 1380,950" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.3"/>
    <path d="M1400,470 C1520,360 1680,310 1850,280" stroke="#0ea5e9" stroke-width="2.5" stroke-opacity="0.25"/>

    <!-- Sub-field Irrigation Feeders -->
    <path d="M780,270 L880,180" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.3"/>
    <path d="M1100,740 L1220,810" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.3"/>
  </g>

  <!-- Water Reservoir Polygons -->
  <g fill="#0284c7" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4">
    <polygon points="340,320 480,280 540,420 380,450"/>
    <polygon points="1450,680 1620,620 1720,780 1510,820"/>
  </g>
</svg>
