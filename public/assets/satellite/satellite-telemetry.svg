<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="satGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0c4a6e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#05192d" stop-opacity="1"/>
    </radialGradient>
    <pattern id="coordGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#satGlow)"/>
  <rect width="1920" height="1080" fill="url(#coordGrid)"/>

  <!-- Orbital Swaths & Radar Sweeps -->
  <g fill="none" stroke="#0ea5e9" stroke-opacity="0.25">
    <ellipse cx="960" cy="540" rx="720" ry="340" stroke-width="2" stroke-dasharray="14 10" transform="rotate(-15 960 540)"/>
    <ellipse cx="960" cy="540" rx="980" ry="460" stroke-width="1.5" stroke-dasharray="8 8" transform="rotate(-15 960 540)"/>
    <ellipse cx="960" cy="540" rx="420" ry="200" stroke-width="1" transform="rotate(-15 960 540)"/>

    <!-- Radar Sweep Arcs -->
    <path d="M400,200 A800,800 0 0,1 1600,300" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>
    <path d="M250,550 A1000,1000 0 0,1 1750,500" stroke="#7dd3fc" stroke-width="1.5" stroke-opacity="0.2"/>
  </g>

  <!-- Sentinel Satellite Geometry Wireframe -->
  <g transform="translate(1380, 180) scale(0.85)" opacity="0.4" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <!-- Solar Panels -->
    <rect x="-140" y="-20" width="90" height="40" fill="#0369a1" fill-opacity="0.3"/>
    <line x1="-110" y1="-20" x2="-110" y2="20"/>
    <line x1="-80" y1="-20" x2="-80" y2="20"/>

    <rect x="50" y="-20" width="90" height="40" fill="#0369a1" fill-opacity="0.3"/>
    <line x1="80" y1="-20" x2="80" y2="20"/>
    <line x1="110" y1="-20" x2="110" y2="20"/>

    <!-- Central Body -->
    <rect x="-40" y="-30" width="80" height="60" rx="4" fill="#0c4a6e" fill-opacity="0.5"/>
    <!-- Sensor Dish -->
    <path d="M-25,30 Q0,55 25,30" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="0" y1="30" x2="0" y2="65" stroke="#7dd3fc"/>
    <!-- Sensor Beam Cone -->
    <polygon points="0,65 -450,750 450,750" fill="#38bdf8" fill-opacity="0.04" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1"/>
  </g>

  <!-- Ground Pixel Inspection Quadrants -->
  <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <rect x="520" y="440" width="220" height="160" stroke-dasharray="6 4"/>
    <line x1="630" y1="420" x2="630" y2="620" stroke-opacity="0.2"/>
    <line x1="500" y1="520" x2="760" y2="520" stroke-opacity="0.2"/>
    <circle cx="630" cy="520" r="8" fill="#38bdf8" fill-opacity="0.4"/>
    <text x="530" y="432" fill="#7dd3fc" font-family="monospace" font-size="11" opacity="0.6">B8 NIR / B4 RED [10m]</text>
  </g>
</svg>
